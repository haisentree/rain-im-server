syntax = "proto3";
package gateway.v1;

import "tagger/tagger.proto";

message ConnectRequest {
    string   client_id = 1 [(tagger.tags) = "validate:\"required\""];
    Platform platform  = 2 [(tagger.tags) = "validate:\"required\""];
}



enum Message {
    MESSAGE_UNSPECIFIED          = 0;
    MESSAGE_SINGLE               = 1;  // 单发消息
    MESSAGE_SINGLE_GATEWAY_RELAY = 2;  // 网关间传递单发消息
    // =======待逻辑设计===========
    MESSAGE_SINGLE_GROUP = 3;           // 群里发送的单条消息

    MESSAGE_PULL    = 4;   // 拉取消息
    MESSAGE_PULL_SEQ   = 5;   // 拉取消息

    MESSAGE_PUSH    = 6;   // 推送消息

    MESSAAGE_RELAY = 7;
        MESSAAGE_RELAY_PACKATE = 8; //合并转发

    MESSAGE_ACTION = 9;    // 动作消息    
    MESSAGE_ACTION_MODIFY = 10;    // 修改消息                          
    MESSAGE_ACTION_CONFIRM = 11;   // 确认消息
    MESSAGE_ACTION_READED  = 12;  // 已读消息
    MESSAGE_ACTION_RECALL  = 13;  // 撤回消息
}

enum Platform {
    PLATFORM_UNSPECIFIED = 0;
    PLATFORM_SYSTEM      = 1;  // 系统
    PLATFORM_WEB         = 2;  // 网页
    PLATFORM_ANDROID     = 3;  // 安卓
    PLATFORM_IPHONE      = 4;  // 苹果
    PLATFORM_WINDOWS     = 5;  // Windows
    PLATFORM_MACOS       = 6;  // Mac
    PLATFORM_LINUX       = 7;  // Linux
    PLATFORM_MOBILE      = 8;  // 移动端通用
    PLATFORM_IPAD        = 9;  // iPad
}

enum MessageStatus {
    MESSAGE_STATUS_UNSPECIFIED          = 0;
    MESSAGE_STATUS_MODIFIED     =1; // 已修改

    // 已编辑
}
