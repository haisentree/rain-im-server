syntax = "proto3";
package gateway.v1;

import "tagger/tagger.proto";
import "base/v1/uuid.proto";
import "gateway/v1/gateway.proto";

message RawMessage {
    Message type = 1;
    bytes   data = 2;
}

message SingleMessage {
    base.v1.UUID source_id = 1;
    base.v1.UUID target_id = 2;
    fixed64      seq       = 3;
    string       content   = 4 [(tagger.tags) = "validate:\"required\""];
    // 时间
}

// TODO: 暂时不使用,RelayGatewaySingleMessage类型的RawMessage,data直接对应了SingleMessage
message RelayGatewaySingleMessage {
    bytes data = 1;
    // 优先级
    // 属性:普通延时，阅后即焚
}

message GroupMessage {
    base.v1.UUID source_id          = 1;
    base.v1.UUID group_id           = 2;
    repeated base.v1.UUID target_id = 3;
    string                content   = 4 [(tagger.tags) = "validate:\"required\""];
}

message RelayMessage {
    base.v1.UUID source_id = 1;
    base.v1.UUID target_id = 2;
    fixed64      seq_id    = 3;
    string       content   = 4 [(tagger.tags) = "validate:\"required\""];
}

message PushMessage {
}

message PullMessage {
    base.v1.UUID client_id   = 1;  // 当前用户ID（必填）
    base.v1.UUID target_id   = 2;  // 聊天对象ID（单聊用户ID/群ID）
    string       last_seq_id = 3;  // 上一条消息ID（分页拉取用）
    int32        limit       = 4;  // 拉取数量（默认20）
}

message ConfirmMessage {  // 网关确认消息不会丢失
}

message ReadedMessage {  // 接收方收到消息
}

